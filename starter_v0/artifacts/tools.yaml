# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi thêm thông tin hoặc xác nhận trước khi cần thiết. Sử dụng khi thiếu asset ID, employee ID, hoặc xác nhận hành động có tác động."
    parameters:
      type: object
      properties:
        question: {type: string, description: "Câu hỏi ngắn cần người dùng trả lời"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu phản hồi cần thiết"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn có thể đưa cho người dùng"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật trong knowledge base nội bộ. Dùng cho câu hỏi hướng dẫn, lỗi phổ biến, hoặc troubleshooting local."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Từ khóa tìm kiếm tùy chọn"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả tối đa"}
      required: []

  - name: check_service_status
    description: "Kiểm tra trạng thái của một dịch vụ được chia sẻ trong môi trường cụ thể (production hoặc staging)."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra toàn bộ hoặc một nhóm chẩn đoán của một asset cụ thể trong kho thiết bị nội bộ."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản, ví dụ LT-204"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin nhân viên và tài sản được cấp trong directory nội bộ."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên, ví dụ EMP-1003"}
      required: [employee_id]

  - name: format_incident_report
    description: "Biến các finding đã có thành báo cáo kỹ thuật hoặc handoff. Không dùng để thu thập thêm dữ liệu mới."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các finding hiện có"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề sự cố"}
      required: [template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ. Dùng khi người dùng hỏi về quyền truy cập, bảo mật, quyền riêng tư, ticketing, incident response, hoặc service operations."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Từ khóa tìm kiếm tùy chọn"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [policy_area]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ local sau khi người dùng xác nhận rõ ràng. Không tạo nếu chưa có confirmation."
    parameters:
      type: object
      properties:
        summary: {type: string, description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, description: "Phải là true khi người dùng xác nhận rõ ràng"}
      required: [confirmed]
